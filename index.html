<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hansika's vibe board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Hansika's vibe board</h1>

  <!-- Glow Line Border Container -->
  <div class="board-container">
    <div class="board-glow"></div>
    
    <div class="vibe-board">
      
      <!-- Fairy Lights Decoration -->
      <div class="fairy-lights">
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
      </div>

      <!-- PHOTO: Picture of Me (Polaroid) -->
      <div class="board-item polaroid" id="card-me">
        <div class="pushpin"></div>
        <img src="assets/me.png" alt="A picture of me">
        <div class="polaroid-caption">me ✨</div>
      </div>

      <!-- PHOTO: Picture of Family (Polaroid) -->
      <div class="board-item polaroid" id="card-family">
        <div class="pushpin"></div>
        <img src="assets/family.png" alt="My family">
        <div class="polaroid-caption">family ❤️</div>
      </div>

      <!-- QUOTE: Favorite Quote (Taped Card) -->
      <div class="board-item quote-card" id="card-quote">
        <div class="washi-tape"></div>
        <blockquote>"Spread love as much as you can"</blockquote>
        <div class="quote-author">Favorite Quote</div>
      </div>

      <!-- INTERESTS & DECORATIONS -->
      
      <!-- Swimming (Mini Poster) -->
      <div class="board-item interest-card swimming" id="interest-swimming">
        <div class="washi-tape washi-blue"></div>
        <h3>swimming 🏊‍♀️</h3>
      </div>

      <!-- Napping (Sticky Note) -->
      <div class="board-item sticky-note purple" id="interest-napping">
        <div class="pushpin"></div>
        <h3>napping 💤</h3>
        <p>Current mood... dreaming in pink and purple.</p>
      </div>

      <!-- Dancing (Retro Poster) -->
      <div class="board-item poster-card dancing" id="interest-dancing">
        <div class="pushpin"></div>
        <h3>dancing 💃</h3>
      </div>

      <!-- Singing (Cassette Tape Card) -->
      <div class="board-item cassette-card singing" id="interest-singing">
        <div class="washi-tape"></div>
        <div class="cassette-label">singing 🎤</div>
      </div>

      <!-- Stickers (Hearts and Stars) -->
      <div class="sticker sticker-heart" id="sticker-heart-1">💖</div>
      <div class="sticker sticker-star" id="sticker-star-1">⭐</div>
      <div class="sticker sticker-heart" id="sticker-heart-2">💝</div>
      <div class="sticker sticker-star" id="sticker-star-2">✨</div>

    </div>
  </div>

  <!-- Small Theme Labels below the board -->
  <div class="labels-container">
    <div class="theme-label">Theme: a pink & purple aesthetic</div>
    <div class="theme-label">Main Color: pink</div>
    <div class="theme-label">Mood: happy & energetic</div>
  </div>

</body>
</html>
